<!-- El orden importa: la librería primero, el theme después. -->
<link rel="stylesheet" href="https://cdn.dynamicframework.dev/assets/2.10.0/ui-react/css/dynamic-ui.min.css">
<link rel="stylesheet" href="../out/theme-ejemplo-zonas.css">

<style>
  /*
   * Estilos de la propia página de preview. Nada de esto forma parte del theme:
   * sirve para montar las dos zonas en paralelo y para forzar estados que de
   * otro modo exigirían interactuar con el navegador.
   */
  body { padding-block: 2rem; }
  .preview-title { font-weight: 700; }
  .preview-section { margin-bottom: 3rem; }
  .preview-section > h2 {
    font-size: 1.125rem;
    padding-bottom: .5rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--bs-border-color);
  }
  .preview-pair { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 991.98px) { .preview-pair { grid-template-columns: 1fr; } }
  .preview-zone {
    padding: 1.25rem;
    border: 1px solid var(--bs-border-color);
    border-radius: var(--bs-border-radius);
    background-color: rgb(var(--bs-body-bg-rgb));
    color: rgb(var(--bs-body-color-rgb));
  }
  .preview-zone-label {
    display: block;
    margin-bottom: .75rem;
    font-size: .6875rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    opacity: .7;
  }
  .contrast-readout { display: block; margin-top: 1rem; font-size: .75rem; opacity: .85; }
  .contrast-readout.is-fail { color: rgb(var(--bs-danger-rgb)); font-weight: 700; }

  /* Muestras de color de la paleta. */
  .ramp { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .75rem; }
  .swatch {
    width: 4.25rem;
    padding: .25rem;
    border: 1px solid var(--bs-border-color);
    border-radius: .25rem;
    font-size: .5625rem;
    line-height: 1.3;
    text-align: center;
  }
  .swatch-chip { display: block; height: 1.75rem; margin-bottom: .25rem; border-radius: .125rem; }

  /*
   * Estados forzados. Bootstrap los expresa con pseudoclases, que una captura
   * estática no puede disparar; estas clases aplican las mismas variables que
   * el componente usaría, así que lo que se ve es el token, no una imitación.
   */
  .btn.force-hover {
    color: var(--bs-btn-hover-color);
    background-color: var(--bs-btn-hover-bg);
    border-color: var(--bs-btn-hover-border-color);
  }
  .btn.force-active {
    color: var(--bs-btn-active-color);
    background-color: var(--bs-btn-active-bg);
    border-color: var(--bs-btn-active-border-color);
  }
  .btn.force-focus {
    box-shadow: 0 0 0 .25rem var(--bs-focus-ring-color);
    outline: 0;
  }
  .form-control.force-focus, .form-select.force-focus {
    border-color: rgba(var(--bs-primary-rgb), .6);
    box-shadow: 0 0 0 .25rem var(--bs-focus-ring-color);
    outline: 0;
  }

  /* Modal montado en su sitio en vez de sobre toda la página. */
  .modal-stage { position: relative; min-height: 15rem; overflow: hidden; border-radius: var(--bs-border-radius); }
  .modal-stage .modal-backdrop { position: absolute; }
  .modal-stage .modal { position: absolute; display: block; }
</style>
</head>

<script>
/*
 * Todo lo que sigue es de la preview, no del theme: monta cada plantilla en las
 * dos zonas, lee los tokens ya resueltos por el navegador y calcula contrastes.
 * Leer con getComputedStyle y no del JSON es deliberado: así lo que se mide es
 * lo que realmente pinta la cascada, incluida la librería del CDN.
 */

const ROLES = ['primary', 'secondary', 'success', 'info', 'warning', 'danger', 'light', 'dark'];
const RAMP = [100, 200, 300, 400, 500, 600, 700, 800, 900];

/** Relación de contraste WCAG 2.x entre dos colores ya resueltos a canales. */
function contrast(a, b) {
  const lum = ({ r, g, b: bl }) => {
    const channel = (v) => {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
    };
    return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(bl);
  };
  const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}

/** Convierte cualquier color que devuelva getComputedStyle a canales enteros. */
function toRgb(value) {
  const nums = String(value).match(/[\d.]+/g);
  if (!nums || nums.length < 3) return null;
  return { r: Math.round(+nums[0]), g: Math.round(+nums[1]), b: Math.round(+nums[2]) };
}

const toHex = ({ r, g, b }) => `#${[r, g, b].map((c) => c.toString(16).padStart(2, '0')).join('')}`;

/**
 * Color de fondo efectivo: sube por los ancestros hasta encontrar uno opaco,
 * porque un fondo transparente no dice nada sobre lo que se ve detrás.
 */
function effectiveBg(node) {
  let el = node;
  while (el && el !== document.documentElement) {
    const value = getComputedStyle(el).backgroundColor;
    const rgb = toRgb(value);
    const alpha = String(value).match(/[\d.]+\)$/);
    if (rgb && (!alpha || parseFloat(alpha[0]) > 0.95)) return rgb;
    el = el.parentElement;
  }
  return toRgb(getComputedStyle(document.body).backgroundColor);
}

/** Lee una variable --bs-<x>-rgb resuelta en el contexto de un elemento. */
function tokenRgb(el, name) {
  const raw = getComputedStyle(el).getPropertyValue(name).trim();
  if (!raw) return null;
  // Puede venir como "0, 204, 197" o ya resuelto a rgb(...).
  return toRgb(raw);
}

/** Tabla de muestras de los ocho roles, con el hex que el navegador resolvió. */
function renderPalette(host) {
  const out = [];
  for (const role of ROLES) {
    const base = tokenRgb(host, `--bs-${role}-rgb`);
    const chips = [];
    for (const step of RAMP) {
      // El 500 apunta al base; light y dark no tienen rampa en la librería.
      const rgb = step === 500
        ? base
        : tokenRgb(host, `--bs-${role}-${step}-rgb`);
      if (!rgb) continue;
      chips.push(`
        <div class="swatch">
          <span class="swatch-chip" style="background-color: rgb(${rgb.r}, ${rgb.g}, ${rgb.b});"></span>
          <strong>${step}</strong><br>${toHex(rgb)}
        </div>`);
    }
    const missing = chips.length === 0
      ? `<div class="swatch"><span class="swatch-chip" style="background-color: rgb(${base.r}, ${base.g}, ${base.b});"></span><strong>base</strong><br>${toHex(base)}</div>`
      : '';
    out.push(`
      <p class="mb-1"><small><strong>${role}</strong>${chips.length === 0 ? ' — la librería no expone rampa para este role' : ''}</small></p>
      <div class="ramp">${chips.join('') || missing}</div>`);
  }
  host.innerHTML = out.join('');
}

/**
 * Par texto/fondo que mide cada sección. Se apunta al elemento que representa
 * el caso interesante de esa sección, no al contenedor.
 */
const PAIRS = {
  body: (zone) => ({ label: 'cuerpo sobre fondo', node: zone }),
  'btn-primary': (zone) => ({ label: '.btn-primary', node: zone.querySelector('.btn-primary') }),
  input: (zone) => ({ label: '.form-control', node: zone.querySelector('.form-control') }),
  card: (zone) => ({ label: '.list-group-item', node: zone.querySelector('.list-group-item') }),
  'alert-info': (zone) => ({ label: '.alert-info', node: zone.querySelector('.alert-info') }),
  'nav-pill': (zone) => ({ label: '.nav-link.active', node: zone.querySelector('.nav-pills .nav-link.active') }),
  modal: (zone) => ({ label: '.modal-content', node: zone.querySelector('.modal-body') }),
};

function readout(zone, pairKey) {
  const spec = (PAIRS[pairKey] || PAIRS.body)(zone);
  const node = spec.node || zone;
  const fg = toRgb(getComputedStyle(node).color);
  const bg = effectiveBg(node);
  if (!fg || !bg) return '';
  const ratio = contrast(fg, bg);
  const ok = ratio >= 4.5;
  return `<small class="contrast-readout${ok ? '' : ' is-fail'}">
    ${spec.label}: ${toHex(fg)} sobre ${toHex(bg)} = <strong>${ratio.toFixed(2)}:1</strong>
    ${ok ? '— cumple AA (4.5:1)' : '— por debajo de AA (4.5:1)'}
  </small>`;
}

function build() {
  const root = document.getElementById('preview-root');
  for (const tpl of document.querySelectorAll('template[data-section]')) {
    const section = document.createElement('section');
    section.className = 'preview-section';
    const onlyDark = tpl.dataset.onlyDark === 'true';

    const zones = onlyDark
      ? [{ label: 'oscura', theme: 'oscura' }]
      : [{ label: 'zona clara', theme: null }, { label: 'oscura', theme: 'oscura' }];

    const pair = document.createElement('div');
    pair.className = 'preview-pair';
    if (onlyDark) pair.style.gridTemplateColumns = '1fr';

    for (const zone of zones) {
      const box = document.createElement('div');
      box.className = 'preview-zone';
      box.dataset.contrastPair = tpl.dataset.contrastPair || 'body';
      if (zone.theme) box.setAttribute('data-bs-theme', zone.theme);
      box.innerHTML = `<span class="preview-zone-label">${zone.label}</span>`;
      box.appendChild(tpl.content.cloneNode(true));
      pair.appendChild(box);
    }

    section.innerHTML = `<h2>${tpl.dataset.section}</h2>`;
    section.appendChild(pair);
    root.appendChild(section);
  }

  // La paleta necesita estar en el DOM para que las variables resuelvan por zona.
  for (const host of document.querySelectorAll('.js-palette')) {
    renderPalette(host.closest('.preview-zone'));
  }

  // Y los contrastes, después de que todo esté pintado. Cada zona lleva su
  // propio par anotado, así que se recorren una sola vez.
  for (const zone of document.querySelectorAll('.preview-zone')) {
    zone.insertAdjacentHTML('beforeend', readout(zone, zone.dataset.contrastPair));
  }
}

// Las fuentes cambian métricas, no colores, pero se espera a que carguen para
// que la captura no salga con la tipografía de respaldo.
document.fonts.ready.then(() => {
  build();
  document.documentElement.dataset.previewReady = 'true';
});
</script>
</body>
