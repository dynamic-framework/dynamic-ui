name: Sync CDN version / latest
on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Sync
    runs-on: ubuntu-latest
    env:
      CDN_BASE_URL: https://cdn.dynamicframework.dev/assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Ensure Rollup binary
        run: |
          # Workaround for Rollup optional dependencies issue in CI
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            echo "Installing missing Rollup Linux binary..."
            npm install @rollup/rollup-linux-x64-gnu --no-save --no-package-lock
          fi
      - name: Build packages
        run: npm run build
      - name: Build Storybook (for versioned manifests)
        run: npm run build:storybook
      - name: Check docs and components manifests
        run: |
          node scripts/check-docs-manifest.mjs docs/manifests/docs.json
          node scripts/check-docs-manifest.mjs docs/manifests/components.json
      - name: Generate registry assets
        run: |
          node scripts/generate-api.mjs
          node scripts/generate-schema.mjs
          node scripts/generate-token-overrides.mjs
          node scripts/generate-token-overrides-schema.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      - name: Validate api.json against schema/v1.json
        run: npm run validate:registry
      - name: Validate token-overrides.json against token-overrides.v1.json
        run: npm run validate:token-overrides
      - name: Fetch existing manifest from S3
        run: |
          # Se lee por el endpoint HTTPS público del bucket, no por el CDN: una copia
          # cacheada en Cloudflare haría que el índice nuevo perdiera las versiones
          # publicadas después. El índice se sube con --acl public-read, así que no
          # hacen falta credenciales. Corre antes de "Publish to CDN".
          HTTP_STATUS=$(curl -s -o /tmp/manifest-prev.json -w "%{http_code}" \
            https://dynamicframework-cdn.s3.amazonaws.com/assets/manifest.json)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::No se pudo leer el índice anterior desde S3 (HTTP $HTTP_STATUS). El índice existe desde 2.5.1 y nunca debe empezar de cero; se detiene el job antes de publicar nada."
            exit 1
          fi
          if ! jq -e .versions /tmp/manifest-prev.json > /dev/null; then
            echo "::error::El índice anterior leído desde S3 no tiene un objeto \"versions\" válido; se detiene el job antes de publicar nada."
            exit 1
          fi
          echo "Índice anterior leído desde S3: $(jq '.versions | length' /tmp/manifest-prev.json) versiones, latest $(jq -r '.latest' /tmp/manifest-prev.json)."
      - name: Generate manifest
        id: manifest
        run: |
          node scripts/generate-manifest.mjs /tmp/manifest-prev.json
          # Las rutas latest/ solo se publican si esta versión es el latest del
          # índice: un backport (p. ej. 2.11.1 después de 2.12.0) o un prerelease
          # se publican solo en su ruta versionada.
          LATEST=$(jq -r '.latest' registry/manifest.json)
          if [ "$LATEST" = "${RELEASE_TAG#v}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "Esta versión es el latest del índice: se publican también las rutas latest/."
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "El latest del índice sigue siendo $LATEST: no se tocan las rutas latest/."
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      - name: Extract semver from package.json
        id: version
        run: echo "semver=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
      - name: Validate tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="${{ steps.version.outputs.semver }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
      - name: Generate custom property diff against previous release
        id: theme_diff
        # Un fallo aquí no bloquea la publicación: el release sale sin
        # changes-<semver>.json y el aviso queda en el resumen del job.
        continue-on-error: true
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          PREV=$(node scripts/theme/theme-diff.mjs --previous-version /tmp/manifest-prev.json "$SEMVER")
          if [ -z "$PREV" ]; then
            echo "::warning::No hay versión estable anterior a $SEMVER en el índice; no se genera tokens/changes-$SEMVER.json."
            exit 0
          fi
          # Desde el bucket y no desde el CDN, por la misma razón que el índice.
          PREV_URL="https://dynamicframework-cdn.s3.amazonaws.com/assets/$PREV/ui-react/css/dynamic-ui.css"
          if ! curl -sf -o /tmp/theme-diff-prev.css "$PREV_URL"; then
            echo "::warning::No se pudo descargar $PREV_URL; no se genera tokens/changes-$SEMVER.json."
            exit 0
          fi
          OUT="/tmp/changes-$SEMVER.json"
          npm run theme:diff -- /tmp/theme-diff-prev.css dist/css/dynamic-ui.css --out "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "Diff de custom properties y clases $PREV → $SEMVER: $(jq -c .summary "$OUT")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Publish to CDN
        run: |
          if [ "${{ steps.manifest.outputs.is_latest }}" = "true" ]; then
            npm run publish:cdn
          else
            npm run publish:cdn-version
          fi
      - name: Upload api.json to CDN (versioned)
        run: |
          aws s3 cp registry/api.json \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/api.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload Storybook components manifest to CDN (versioned)
        run: |
          aws s3 cp docs/manifests/components.json \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/manifests/components.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload Storybook docs manifest to CDN (versioned)
        run: |
          aws s3 cp docs/manifests/docs.json \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/manifests/docs.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload api.json to CDN (latest — manifest latest only)
        if: ${{ steps.manifest.outputs.is_latest == 'true' }}
        run: |
          aws s3 cp registry/api.json \
            s3://dynamicframework-cdn/assets/latest/ui-react/api.json \
            --acl public-read \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Upload Storybook components manifest to CDN (latest — manifest latest only)
        if: ${{ steps.manifest.outputs.is_latest == 'true' }}
        run: |
          aws s3 cp docs/manifests/components.json \
            s3://dynamicframework-cdn/assets/latest/ui-react/manifests/components.json \
            --acl public-read \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Upload Storybook docs manifest to CDN (latest — manifest latest only)
        if: ${{ steps.manifest.outputs.is_latest == 'true' }}
        run: |
          aws s3 cp docs/manifests/docs.json \
            s3://dynamicframework-cdn/assets/latest/ui-react/manifests/docs.json \
            --acl public-read \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Upload icons-core.json to CDN (versioned)
        run: |
          aws s3 cp dist/icons-core.json \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/icons-core.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload icons-core.json to CDN (latest — manifest latest only)
        if: ${{ steps.manifest.outputs.is_latest == 'true' }}
        run: |
          aws s3 cp dist/icons-core.json \
            s3://dynamicframework-cdn/assets/latest/ui-react/icons-core.json \
            --acl public-read \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Upload JSON Schema to CDN
        run: |
          aws s3 cp registry/schema/v1.json \
            s3://dynamicframework-cdn/assets/schema/v1.json \
            --acl public-read \
            --cache-control "public, max-age=86400"
      - name: Upload token-overrides.json to CDN (versioned)
        run: |
          aws s3 cp registry/token-overrides.json \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/tokens/token-overrides.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload token-overrides.json to CDN (latest — manifest latest only)
        if: ${{ steps.manifest.outputs.is_latest == 'true' }}
        run: |
          aws s3 cp registry/token-overrides.json \
            s3://dynamicframework-cdn/assets/latest/ui-react/tokens/token-overrides.json \
            --acl public-read \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Upload custom property diff to CDN (versioned)
        if: ${{ steps.theme_diff.outputs.file != '' }}
        run: |
          aws s3 cp "${{ steps.theme_diff.outputs.file }}" \
            s3://dynamicframework-cdn/assets/${{ steps.version.outputs.semver }}/ui-react/tokens/changes-${{ steps.version.outputs.semver }}.json \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
      - name: Upload token-overrides JSON Schema to CDN
        run: |
          aws s3 cp registry/schema/token-overrides.v1.json \
            s3://dynamicframework-cdn/assets/schema/token-overrides.v1.json \
            --acl public-read \
            --cache-control "public, max-age=86400"
      - name: Upload manifest to CDN
        run: |
          aws s3 cp registry/manifest.json \
            s3://dynamicframework-cdn/assets/manifest.json \
            --acl public-read \
            --cache-control "public, max-age=60"
      - name: Smoke test — verify versioned and latest assets are accessible on CDN with application/json content-type
        run: |
          PATHS=("api.json" "manifests/components.json" "manifests/docs.json" "tokens/token-overrides.json" "icons-core.json")
          BASES=("${{ env.CDN_BASE_URL }}/${{ steps.version.outputs.semver }}/ui-react")
          if [ "${{ steps.manifest.outputs.is_latest }}" = "true" ]; then
            BASES+=("${{ env.CDN_BASE_URL }}/latest/ui-react")
          fi
          VERSIONED_BASE="${BASES[0]}"
          # changes-<semver>.json solo existe en la ruta versionada y solo si se generó.
          VERSIONED_EXTRA=()
          if [ -n "${{ steps.theme_diff.outputs.file }}" ]; then
            VERSIONED_EXTRA+=("tokens/changes-${{ steps.version.outputs.semver }}.json")
          fi
          for BASE in "${BASES[@]}"; do
            BASE_PATHS=("${PATHS[@]}")
            if [ "$BASE" = "$VERSIONED_BASE" ]; then
              BASE_PATHS+=("${VERSIONED_EXTRA[@]}")
            fi
            for path in "${BASE_PATHS[@]}"; do
              URL="$BASE/$path"
              echo "Checking $URL"
              success=0
              STATUS=""
              CTYPE=""
              for i in $(seq 1 24); do
                INFO=$(curl -s -o /dev/null -w '%{http_code}|%{content_type}' "$URL")
                STATUS="${INFO%|*}"
                CTYPE="${INFO#*|}"
                if [ "$STATUS" = "200" ]; then
                  case "$CTYPE" in
                    application/json*)
                      echo "✓ $URL is accessible on CDN (HTTP 200, $CTYPE)"
                      success=1
                      break
                      ;;
                    *)
                      echo "Attempt $i/24: HTTP 200 but unexpected content-type '$CTYPE' — waiting 5s..."
                      ;;
                  esac
                else
                  echo "Attempt $i/24: HTTP $STATUS — waiting 5s..."
                fi
                sleep 5
              done
              if [ "$success" = "0" ]; then
                echo "✗ $URL not served as application/json on CDN after 2 minutes (last: HTTP $STATUS, content-type '$CTYPE')" >&2
                exit 1
              fi
            done
          done
      - name: Remind Cloudflare cache invalidation
        run: |
          MSG="Invalidar la caché de Cloudflare de cdn.dynamicframework.dev/assets/ (todo lo que está debajo)"
          CHECK='curl -s https://cdn.dynamicframework.dev/assets/manifest.json | jq -r .latest'
          echo "::notice::$MSG. Comprobación: $CHECK"
          {
            echo "$MSG"
            echo ""
            echo "Comprobación: \`$CHECK\`"
          } >> "$GITHUB_STEP_SUMMARY"
