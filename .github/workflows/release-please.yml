name: Release

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    name: Version and Release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
          target-branch: master
          config-file: release-please-config.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
          scope: '@dynamic-framework'

      - name: Update npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Ensure Rollup binary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            echo "Installing missing Rollup Linux binary..."
            npm install @rollup/rollup-linux-x64-gnu --no-save --no-package-lock
          fi

      - name: Build packages
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Publish to NPM
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Append CSS diff command to release notes
        if: ${{ steps.release.outputs.release_created }}
        # Informativo: el release y la publicación en npm ya están hechos; si falla, no marca el workflow como fallido.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Versión estable inmediatamente menor por semver (en un backport no es el latest).
          PREV=$(gh release list --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName | ltrimstr("v")' \
            | sort -V | grep -x -B1 "$VERSION" | head -n -1)
          if [ -z "$PREV" ]; then
            echo "::warning::No hay versión estable anterior a $VERSION; no se agrega el comando de diff."
            exit 0
          fi
          gh release view "$TAG" --json body -q .body > /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<EOF

          ### CSS changes

          To see what changed in the compiled CSS since v$PREV, run:

          \`\`\`bash
          npm diff --diff=@dynamic-framework/ui-react@$PREV --diff=@dynamic-framework/ui-react@$VERSION dist/css/dynamic-ui.css
          \`\`\`
          EOF
          gh release edit "$TAG" --notes-file /tmp/release-notes.md
