# El nombre del archivo se mantiene: el trusted publisher de npm (OIDC) está
# configurado para este workflow. Renombrarlo rompe la publicación.
name: Release

on:
  push:
    branches:
      - master
  # Regenera el draft sobre master después de borrarlo a mano.
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  draft:
    name: Draft release
    if: github.event_name != 'release' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-draft
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Una release existente no se edita ni se borra: alguien puede publicarla
      # entre la lectura y la escritura.
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          read -r IS_DRAFT TARGET <<< "$(gh release view "$TAG" --json isDraft,targetCommitish \
            --jq '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null || true)"
          if [ "$IS_DRAFT" = "false" ]; then
            echo "$TAG ya está publicado: no se crea draft."
          elif [ "$TARGET" = "$GITHUB_SHA" ]; then
            echo "El draft $TAG ya apunta a $GITHUB_SHA."
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "::error::El draft $TAG apunta a $TARGET, no a $GITHUB_SHA. Bórralo sin publicarlo y ejecuta este workflow desde master (Run workflow)."
            exit 1
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous stable version
        id: prev
        if: steps.existing.outputs.create == 'true'
        # Solo alimenta el comando de diff del CSS: si falla, el draft se crea sin él.
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Versión estable inmediatamente menor por semver entre las publicadas en npm (en un backport no es el latest).
          PREV=$({ npm view @dynamic-framework/ui-react versions --json | jq -r '.[] | select(test("-") | not)'; echo "$VERSION"; } \
            | sort -uV | grep -x -B1 "$VERSION" | head -n -1)
          echo "version=$PREV" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.existing.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.prev.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$NOTES"
          if [ -n "$PREV" ]; then
            cat >> "$NOTES" <<EOF

          ### CSS changes

          To see what changed in the compiled CSS since v$PREV, run:

          \`\`\`bash
          npm diff --diff=@dynamic-framework/ui-react@$PREV --diff=@dynamic-framework/ui-react@$VERSION dist/css/dynamic-ui.css
          \`\`\`
          EOF
          else
            echo "::warning::No hay versión estable anterior a $VERSION; no se agrega el comando de diff."
          fi
          # --target: la rama por defecto es develop; el tag tiene que quedar en master.
          gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" --notes-file "$NOTES"

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
          scope: '@dynamic-framework'

      - name: Update npm
        # OIDC requiere npm >= 11.5.1.
        run: npm install -g npm@11.5.1

      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::El tag $TAG no coincide con package.json ($VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup binary
        run: |
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            echo "Installing missing Rollup Linux binary..."
            npm install @rollup/rollup-linux-x64-gnu --no-save --no-package-lock
          fi

      - name: Build packages
        run: npm run build

      - name: Publish to npm
        # Sin NODE_AUTH_TOKEN: autentica por OIDC (trusted publisher).
        run: npm publish --access public
