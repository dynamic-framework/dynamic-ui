name: Checks
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - master
      - develop

jobs:
  checks:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Ensure Rollup binary
        run: |
          # Workaround for Rollup optional dependencies issue in CI
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            echo "Installing missing Rollup Linux binary..."
            npm install @rollup/rollup-linux-x64-gnu --no-save --no-package-lock
          fi
      - name: Build packages
        run: npm run build
      - name: Lint packages
        run: |
          npm run eslint
          npm run stylelint
      # Enforces the token contract: ramp properties, alias-only layers,
      # reference direction, name uniqueness, mode parity and contrast.
      # See tokens/README.md for what each rule is protecting against.
      - name: Verify and validate design tokens
        run: |
          npm run tokens:verify
          npm run tokens:validate
      # Builds the 3.x stylesheet and checks it end to end: no dangling custom
      # properties (the shape every 2.x CSS typo took), every variant x role
      # combination resolves, every opaque fill clears 4.5:1 in both colour
      # modes, and every spacing and colour comes from a token rather than a
      # literal or a raw palette step. Also enforces the size budgets.
      - name: Build and verify the stylesheet
        run: npm run css
      - name: Check tokens/ is in sync with its generators
        run: |
          npm run tokens:primitives
          if ! git diff --quiet -- tokens/; then
            echo "::error::tokens/ is out of date. Run \`npm run tokens:primitives\` and commit the result."
            git --no-pager diff -- tokens/
            exit 1
          fi
      # The stories are the documentation, and nothing here was checking
      # them: a snippet that no longer compiles, a preview hook called where
      # it throws, or a raw DOM event handed to the actions addon all shipped
      # green. The last one is a performance bug rather than a broken build —
      # see scripts/stories/check-event-actions.mjs.
      - name: Check the stories
        run: |
          npm run typecheck:stories
          npm run stories:snippets
          npm run stories:actions
          npm run storybook:hooks
      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Test packages
        run: npm run test
